substitutions:
  unit_id: B
  devicename_unit_id: b
  zone_1_name: Sprinklers - zone 1
  zone_2_name: Sprinklers - zone 2
  zone_3_name: Sprinklers - zone 3
  zone_4_name: Sprinklers - zone 4
  zone_5_name: Dripline
  software_version: 2022 10 18  v11
  sensor_update_frequency: 120s
  # DO NOT CHANGE ANYTHING BELOW THIS LINE ###
  esphome_name: irrigation-ctrl-unit-$devicename_unit_id
  esphome_comment: Five Valve Irrigation Control - $unit_id
  esphome_project_name: kratochj.Four Valve Irrigation Control - $unit_id
  esphome_project_version: $software_version
  devicename: irrigation_valve_controller_unit_$devicename_unit_id
  upper_devicename: Five Valve Irrigation Ctrl - $unit_id
  uom: Min

esp8266:
  board: esp01_1m

esphome:
  name: $esphome_name
  friendly_name: $upper_devicename
  comment: $esphome_comment
  project:
    name: $esphome_project_name
    version: $esphome_project_version
  on_boot:
    priority: -100
    then:
      # Set default state for Valve Status
      - text_sensor.template.publish:
          id: valve_status_$devicename_unit_id
          state: "Idle"

# WiFi connection, replace these with values for your WiFi.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable logging
logger:

# Enable Home Assistant API with encryption
api:
  encryption:
    key: !secret api_enc_key

# Enable over-the-air updates.
ota:
  - platform: esphome
    password: !secret ota_password

# Enable Web server.
web_server:
  port: 80

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  # Expose ESPHome version as sensor.
  - platform: version
    name: Version

  # Expose WiFi information as sensor.
  - platform: wifi_info
    ip_address:
      name: $devicename IP
    ssid:
      name: $devicename SSID
    bssid:
      name: $devicename BSSID

  # Expose Valve Status as a sensor.
  - platform: template
    id: valve_status_$devicename_unit_id
    name: "Status ($unit_id)"
    update_interval: never
    icon: "mdi:information-variant"

  # Expose Time Remaining as a sensor.
  - platform: template
    id: time_remaining_$devicename_unit_id
    name: "Time Remaining ($unit_id)"
    update_interval: $sensor_update_frequency
    icon: "mdi:timer-sand"
    lambda: |-
      int seconds = round(id($devicename).time_remaining_current_operation().value_or(0));
      int days = seconds / (24 * 3600);
      seconds = seconds % (24 * 3600);
      int hours = seconds / 3600;
      seconds = seconds % 3600;
      int minutes = seconds / 60;
      seconds = seconds % 60;
      std::string result;
      if (days) result += std::to_string(days) + "d ";
      if (hours) result += std::to_string(hours) + "h ";
      if (minutes) result += std::to_string(minutes) + "m ";
      result += std::to_string(seconds) + "s";
      return result;

  # Expose Progress Percent as a sensor.
  - platform: template
    id: progress_percent_$devicename_unit_id
    name: "Progress % ($unit_id)"
    update_interval: $sensor_update_frequency
    icon: "mdi:progress-clock"
    lambda: |-
      uint32_t total = id($devicename).total_cycle_time_enabled_valves();
      auto rep = id($devicename).repeat();
      if (rep.has_value()) {
        total *= (rep.value() + 1);
      }
      if (total == 0) {
        return std::string("0");
      }
      uint32_t remaining = id($devicename).time_remaining_current_operation().value_or(0);
      int progress = round(((float)(total - remaining) / (float)total) * 100.0f);
      if (progress < 0) progress = 0;
      if (progress > 100) progress = 100;
      return std::to_string(progress);

sprinkler:
  - id: $devicename
    main_switch:
      name: "Start/Stop/Resume ($unit_id)"
      id: main_switch
    auto_advance_switch:
      name: "Auto Advance ($unit_id)"
      icon: "mdi:page-next-outline"
      restore_mode: RESTORE_DEFAULT_ON
    reverse_switch:
      name: "Reverse ($unit_id)"
      icon: "mdi:undo-variant"
    multiplier_number:
      name: "Multiplier ($unit_id)"
      icon: "mdi:multiplication"
      initial_value: 1.0
      min_value: 0.1
      max_value: 3.0
      step: 0.1
      restore_value: true
    repeat_number:
      name: "Repeat ($unit_id)"
      icon: "mdi:repeat"
      initial_value: 0
      min_value: 0
      max_value: 5
      step: 1
      restore_value: true
    valve_open_delay: 1s
    pump_start_pump_delay: 2s
    pump_stop_valve_delay: 2s
    valves:
      - valve_switch:
          name: $zone_1_name
          icon: "mdi:sprinkler-variant"
        enable_switch:
          name: Enable $zone_1_name
          icon: "mdi:check-circle-outline"
        pump_switch_id: ${devicename}_pump
        run_duration_number:
          name: "$zone_1_name Run Duration"
          unit_of_measurement: $uom
          icon: "mdi:timer-outline"
          initial_value: 15
          min_value: 1
          max_value: 60
          step: 1
          restore_value: true
        valve_switch_id: ${devicename}_1

      - valve_switch:
          name: $zone_2_name
          icon: "mdi:sprinkler-variant"
        enable_switch:
          name: Enable $zone_2_name
          icon: "mdi:check-circle-outline"
        pump_switch_id: ${devicename}_pump
        run_duration_number:
          name: "$zone_2_name Run Duration"
          unit_of_measurement: $uom
          icon: "mdi:timer-outline"
          initial_value: 15
          min_value: 1
          max_value: 60
          step: 1
          restore_value: true
        valve_switch_id: ${devicename}_2

      - valve_switch:
          name: $zone_3_name
          icon: "mdi:sprinkler-variant"
        enable_switch:
          name: Enable $zone_3_name
          icon: "mdi:check-circle-outline"
        pump_switch_id: ${devicename}_pump
        run_duration_number:
          name: "$zone_3_name Run Duration"
          unit_of_measurement: $uom
          icon: "mdi:timer-outline"
          initial_value: 15
          min_value: 1
          max_value: 60
          step: 1
          restore_value: true
        valve_switch_id: ${devicename}_3

      - valve_switch:
          name: $zone_4_name
          icon: "mdi:sprinkler-variant"
        enable_switch:
          name: Enable $zone_4_name
          icon: "mdi:check-circle-outline"
        pump_switch_id: ${devicename}_pump
        run_duration_number:
          name: "$zone_4_name Run Duration"
          unit_of_measurement: $uom
          icon: "mdi:timer-outline"
          initial_value: 15
          min_value: 1
          max_value: 60
          step: 1
          restore_value: true
        valve_switch_id: ${devicename}_4

      - valve_switch:
          name: $zone_5_name
          icon: "mdi:sprinkler-variant"
        enable_switch:
          name: Enable $zone_5_name
          icon: "mdi:check-circle-outline"
        pump_switch_id: ${devicename}_pump
        run_duration_number:
          name: "$zone_5_name Run Duration"
          unit_of_measurement: $uom
          icon: "mdi:timer-outline"
          initial_value: 8
          min_value: 1
          max_value: 60
          step: 1
          restore_value: true
        valve_switch_id: ${devicename}_5

button:
  - platform: template
    id: sprinkler_pause
    name: "Pause ($unit_id)"
    icon: "mdi:pause"
    on_press:
      then:
        - text_sensor.template.publish:
            id: valve_status_$devicename_unit_id
            state: "Paused"
        - sprinkler.pause: $devicename

sensor:
  - platform: dht
    pin: GPIO12
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    update_interval: 60s

switch:
  # Valve relay switches (hidden from HA, controlled by sprinkler component)
  - platform: gpio
    name: Relay Board Pin IN1
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    id: ${devicename}_1
    on_turn_on:
      - text_sensor.template.publish:
          id: valve_status_$devicename_unit_id
          state: "Running"
    on_turn_off:
      - text_sensor.template.publish:
          id: valve_status_$devicename_unit_id
          state: "Idle"
    pin:
      number: GPIO16
      inverted: true

  - platform: gpio
    name: Relay Board Pin IN2
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    id: ${devicename}_2
    on_turn_on:
      - text_sensor.template.publish:
          id: valve_status_$devicename_unit_id
          state: "Running"
    on_turn_off:
      - text_sensor.template.publish:
          id: valve_status_$devicename_unit_id
          state: "Idle"
    pin:
      number: GPIO5
      inverted: true

  - platform: gpio
    name: Relay Board Pin IN3
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    id: ${devicename}_3
    on_turn_on:
      - text_sensor.template.publish:
          id: valve_status_$devicename_unit_id
          state: "Running"
    on_turn_off:
      - text_sensor.template.publish:
          id: valve_status_$devicename_unit_id
          state: "Idle"
    pin:
      number: GPIO4
      inverted: true

  - platform: gpio
    name: Relay Board Pin IN4
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    id: ${devicename}_4
    on_turn_on:
      - text_sensor.template.publish:
          id: valve_status_$devicename_unit_id
          state: "Running"
    on_turn_off:
      - text_sensor.template.publish:
          id: valve_status_$devicename_unit_id
          state: "Idle"
    pin:
      number: GPIO0
      inverted: true

  - platform: gpio
    name: Relay Board Pin IN5
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    id: ${devicename}_5
    on_turn_on:
      - text_sensor.template.publish:
          id: valve_status_$devicename_unit_id
          state: "Running"
    on_turn_off:
      - text_sensor.template.publish:
          id: valve_status_$devicename_unit_id
          state: "Idle"
    pin:
      number: GPIO14
      inverted: true

  # Pump relay
  - platform: gpio
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    id: ${devicename}_pump
    pin:
      number: GPIO2
      inverted: true
